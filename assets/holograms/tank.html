<!DOCTYPE html><!-- blueprint: mavi şema teması --><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Paletli Tank Robot 3D Hologram</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style></head><body><canvas id="c"></canvas><div class="scan"></div>
<div class="top">BLUEPRINT 3D · PALETLİ ROBOT<b id="deg">0°</b></div>
<div class="ui"><div class="card" id="card"></div><div class="chips" id="chips"></div><div class="bar"><button id="bR">⏸ DÖNÜŞ</button><button id="bM">⏸ SÜRÜŞ</button><button id="bE">⬍ PATLAT</button><button id="bF">◧ TEL KAFES</button></div><div class="ft">MERAL Robotik Kulübü</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,PI=Math.PI,cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene(),cam=new T.PerspectiveCamera(50,1,.1,500);
const pivot=new T.Group(),robot=new T.Group();pivot.add(robot);S.add(pivot);
const fills=[],AD=T.AdditiveBlending,G={};let cur='',par=robot;
const CY=0x66f0ff,AMB=0xffc933,WH=0xdfffff,GRN=0x3dffa0,ORG=0xff8a3a,BLU=0x2aa8ff,RED=0xff4d6d;
const bp=c=>{const k=new T.Color(c),l=.299*k.r+.587*k.g+.114*k.b;return new T.Color().setHSL(.6,.85,.58+.3*l)};
function part(g,c,x=0,y=0,z=0,o={}){c=bp(c);const q=new T.Group();
 const m=new T.Mesh(g,new T.MeshBasicMaterial({color:c,transparent:true,opacity:(o.f??.2)*.8,blending:AD,depthWrite:false,side:T.DoubleSide}));
 const l=new T.LineSegments(new T.EdgesGeometry(g,28),new T.LineBasicMaterial({color:c,transparent:true,opacity:.95,blending:AD}));
 q.add(m,l);q.position.set(x,y,z);if(o.r)q.rotation.set(...o.r);const w=new T.Group();w.add(q);(o.p||par).add(w);fills.push(m);m.userData.f=m.material.opacity;l.userData.c=l.material.color.clone();(G[cur]=G[cur]||[]).push({m,l,q,w});return q}
const B=(a,b,c)=>new T.BoxGeometry(a,b,c),C=(r,h,s=24)=>new T.CylinderGeometry(r,r,h,s);
const J=(p,x,y,z)=>{const g=new T.Group();g.position.set(x,y,z);p.add(g);return g};
const PR=14,H=14,LY=3.5,FIT=14,CMIN=34;

const Lt=22,Rt=3.1,Ls=Lt-2*Rt,PP=2*Ls+2*PI*Rt;
function stad(L,Hh,th,wall){const r=Hh/2,l=L/2-r,s=new T.Shape();s.moveTo(-l,0);s.lineTo(l,0);s.absarc(l,r,r,-PI/2,PI/2,false);s.lineTo(-l,2*r);s.absarc(-l,r,r,PI/2,3*PI/2,false);
 const r2=r-wall,h=new T.Path();h.moveTo(-l,wall);h.lineTo(l,wall);h.absarc(l,r,r2,-PI/2,PI/2,false);h.lineTo(-l,2*r-wall);h.absarc(-l,r,r2,PI/2,3*PI/2,false);s.holes.push(h);
 const g=new T.ExtrudeGeometry(s,{depth:th,bevelEnabled:false});g.translate(0,0,-th/2);g.rotateY(PI/2);return g}
function onPath(s){s=((s%PP)+PP)%PP;const a=Ls,b=Ls+PI*Rt,c=2*Ls+PI*Rt;
 if(s<a)return[-Ls/2+s,2*Rt,0];
 if(s<b){const th=(s-a)/Rt;return[Ls/2+Rt*Math.sin(th),Rt+Rt*Math.cos(th),th]}
 if(s<c)return[Ls/2-(s-b),0,PI];
 const th=(s-c)/Rt;return[-Ls/2-Rt*Math.sin(th),Rt-Rt*Math.cos(th),PI+th]}
const blocks=[],spin=[],offs=[0,0];
[-1,1].forEach((sd,si)=>{const X=sd*5.8;
 cur='track';part(stad(Lt,2*Rt,3,.5),CY,X,0,0,{f:.18});
 for(let i=0;i<36;i++)blocks.push({q:part(B(3.4,.45,.9),CY,X,0,0,{f:.35}),i,si});
 cur='sprocket';const sp=J(robot,X,Rt,-Ls/2);spin.push({g:sp,r:2.5,si});
 part(C(2.5,2.6,24),AMB,0,0,0,{p:sp,r:[0,0,PI/2],f:.3});
 for(let k=0;k<12;k++){const a=k/12*2*PI;part(B(2.6,.5,.7),AMB,0,Math.cos(a)*2.6,Math.sin(a)*2.6,{p:sp,r:[a,0,0],f:.4})}
 cur='wheels';const id=J(robot,X,Rt,Ls/2);spin.push({g:id,r:2.5,si});
 part(C(2.5,2.4,24),WH,0,0,0,{p:id,r:[0,0,PI/2],f:.25});part(C(.7,2.8,12),WH,0,0,0,{p:id,r:[0,0,PI/2],f:.5});
 [-3.9,-1.3,1.3,3.9].forEach(z=>{const rw=J(robot,X,1.7,z);spin.push({g:rw,r:1.4,si});
  part(C(1.4,2.2,20),WH,0,0,0,{p:rw,r:[0,0,PI/2],f:.28});part(C(.5,2.5,10),AMB,0,0,0,{p:rw,r:[0,0,PI/2],f:.5})});
 cur='motors';part(B(2.2,2.2,3.4),AMB,sd*2.6,3.1,-Ls/2,{f:.3});part(C(.35,3.2,8),WH,sd*4.2,3.1,-Ls/2,{r:[0,0,PI/2],f:.5});
});
cur='hull';
part(B(8.4,2.6,19.2),CY,0,4.5,0,{f:.25});part(B(7,.5,13),CY,0,6.1,-.5,{f:.3});
[-1,1].forEach(s=>part(B(.9,.5,.3),WH,s*2.5,4.8,9.7,{f:.8}));
cur='ctrl';
part(B(5,.2,5),GRN,0,5.35,-2,{f:.4});part(B(1.2,.25,1.2),WH,.8,5.55,-1.5,{f:.6});part(B(4.2,1.7,6),AMB,0,4.2,4.3,{f:.3});
[-1,0,1].forEach(i=>part(B(.3,.2,.3),RED,i*.8,5.55,-3.4,{f:.8}));
cur='turret';
const tg2=J(robot,0,6.4,1);
part(C(2.6,.4,32),WH,0,0,0,{p:tg2,f:.35});part(new T.SphereGeometry(2.2,20,10,0,2*PI,0,PI/2),CY,0,.2,0,{p:tg2,f:.22});
part(B(1.4,1.1,1.8),CY,0,1.0,1.4,{p:tg2,f:.35});part(C(.35,.8,16),WH,0,1.0,2.5,{p:tg2,r:[PI/2,0,0],f:.6});part(C(.1,4,6),WH,-1.2,3.2,-.8,{p:tg2,f:.6});
function upd(){blocks.forEach(b=>{const p=onPath(b.i/36*PP+offs[b.si]);b.q.position.y=p[1];b.q.position.z=p[0];b.q.rotation.x=p[2]})}
upd();

// Sahne
const gr=new T.GridHelper(PR*4,40,0x9ccfff,0x3a78d8);gr.material.transparent=true;gr.material.opacity=.35;S.add(gr);
[1,1.25,1.5].forEach((k,i)=>{const m=new T.Mesh(new T.RingGeometry(PR*k,PR*k+PR*.008,128),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.7-i*.2,blending:AD,side:T.DoubleSide}));m.rotation.x=-PI/2;S.add(m)});
const tk=[];for(let i=0;i<72;i++){const a=i/72*2*PI,l=(i%6?.035:.08)*PR,r0=PR*1.32;tk.push(Math.cos(a)*r0,0,Math.sin(a)*r0,Math.cos(a)*(r0+l),0,Math.sin(a)*(r0+l))}
const tg=new T.BufferGeometry();tg.setAttribute('position',new T.Float32BufferAttribute(tk,3));S.add(new T.LineSegments(tg,new T.LineBasicMaterial({color:0xd6ebff,transparent:true,opacity:.6})));
const mk=new T.Mesh(new T.ConeGeometry(PR*.035,PR*.07,3),new T.MeshBasicMaterial({color:0xffffff,blending:AD}));mk.rotation.x=PI;S.add(mk);
const pd=new T.Mesh(C(PR,.3,96),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.08,blending:AD,depthWrite:false}));pd.position.y=-.2;S.add(pd);
const pe=new T.LineSegments(new T.EdgesGeometry(C(PR,.3,96),20),new T.LineBasicMaterial({color:0xd6ebff,transparent:true,opacity:.8}));pe.position.y=-.2;S.add(pe);
const og=new T.Group(),oM=new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.6,blending:AD,side:T.DoubleSide});for(let i=0;i<20;i++)og.add(new T.Mesh(new T.RingGeometry(PR*1.75,PR*1.75+PR*.014,10,1,i/20*2*PI,2*PI/20*.6),oM));og.rotation.x=-PI/2;S.add(og);
const beam=new T.Mesh(new T.CylinderGeometry(PR*.9,PR*1.05,H,64,1,true),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.04,blending:AD,side:T.DoubleSide,depthWrite:false}));beam.position.y=H/2;S.add(beam);
const sr=new T.Mesh(new T.TorusGeometry(PR*.9,.07,8,128),new T.MeshBasicMaterial({color:0xe8f3ff,blending:AD}));sr.rotation.x=PI/2;S.add(sr);
const N=240,pp=new Float32Array(N*3);for(let i=0;i<N;i++){const a=Math.random()*2*PI,r=Math.random()*PR*1.1;pp.set([Math.cos(a)*r,Math.random()*H,Math.sin(a)*r],i*3)}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pp,3));S.add(new T.Points(pg,new T.PointsMaterial({color:0xd6ebff,size:PR*.012+.1,transparent:true,opacity:.8,blending:AD})));
// Etkileşim
let auto=true,mov=true,drag=false,lx=0,ly=0,wire=false,tgt=null,sk=null,mv=1;pivot.rotation.x=0.25;
cv.onpointerdown=e=>{tgt=null;drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)};
cv.onpointerup=cv.onpointercancel=()=>drag=false;
cv.onpointermove=e=>{if(!drag)return;pivot.rotation.y+=(e.clientX-lx)*.01;pivot.rotation.x=Math.max(-.3,Math.min(.9,pivot.rotation.x+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY};
bR.onclick=()=>{auto=!auto;if(auto)tgt=null;bR.textContent=auto?'⏸ DÖNÜŞ':'▶ DÖNÜŞ'};
bM.onclick=()=>{mov=!mov;bM.textContent=(mov?'⏸ ':'▶ ')+'SÜRÜŞ'};
bF.onclick=()=>{wire=!wire;fills.forEach(m=>m.visible=!wire);bF.textContent=wire?'◨ DOLU':'◧ TEL KAFES'};
const INFO={"hull": {"n": "Gövde", "y": 0.6, "x": 0.5, "t": "Elektronik, motor ve bataryayı taşıyan ana kutu; iki palet grubunu birbirine bağlar."}, "track": {"n": "Palet Bandı", "y": 1.5, "x": 0.2, "t": "Lastik ya da plastik halka; zeminle geniş temas alanı oluşturur. Bu yüzden yumuşak ve engebeli zeminde tekerleğe göre daha iyi tutunur. Üstteki bloklar paletin hareketini gösterir."}, "sprocket": {"n": "Tahrik Dişlisi", "y": 1.4, "x": 0.2, "t": "Motorun gücünü palete aktarır; dişleri palet bloklarına kavrar. Modelde arkada gösterilmiştir."}, "wheels": {"n": "Avara ve Yol Tekerlekleri", "y": 1.5, "x": 0.15, "t": "Önde paleti gergin tutan avara tekerlek, altta robotun ağırlığını palet boyunca dağıtan yol tekerlekleri bulunur."}, "motors": {"n": "Motorlar ve Dişli Kutuları (2)", "y": 0.5, "x": 0.9, "t": "Her palet kendi motoruyla sürülür. İki palet arasındaki hız farkı robotu döndürür (skid steer); direksiyon yoktur, yerinde dönüş de mümkündür."}, "ctrl": {"n": "Kontrol Kartı ve Batarya", "y": 0.4, "x": 0.9, "t": "Motor sürücüsü ve denetleyici motor hızlarını ayarlar. Ağır batarya aşağıda tutulduğunda ağırlık merkezi alçalır ve devrilme riski azalır."}, "turret": {"n": "Kamera Kulesi", "y": 0.5, "x": 0.35, "t": "Dönebilen kule; kamera ve sensör taşır, böylece gövde dönmeden çevre taranabilir. Modeldeki kule örnek amaçlıdır."}};
function hl(k){Object.keys(G).forEach(g=>G[g].forEach(o=>{const on=!k||g===k;o.m.material.opacity=k?(on?Math.min(.75,o.m.userData.f*2.2+.2):o.m.userData.f*.2):o.m.userData.f;o.l.material.color.copy(k&&on?new T.Color(0xffffff):o.l.userData.c);o.l.material.opacity=k&&!on?.2:.95}))}
function pick(k){sk=k;hl(k);document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.k===(k||'')));
 if(!k){card.innerHTML='Bir parça seçerek tanıtımını oku. Robot o parçaya döner.';tgt=null;auto=true;mov=true;bR.textContent='⏸ DÖNÜŞ';bM.textContent='⏸ SÜRÜŞ';return}
 const d=INFO[k];card.innerHTML='<b>'+d.n+'</b>'+d.t;tgt={y:d.y,x:d.x};auto=false;mov=false;bR.textContent='▶ DÖNÜŞ';bM.textContent='▶ SÜRÜŞ'}
chips.innerHTML='<button data-k="" class="on">TÜMÜ</button>'+Object.keys(INFO).map(k=>'<button data-k="'+k+'">'+INFO[k].n.split(' (')[0]+'</button>').join('');
chips.onclick=e=>{const b=e.target.closest('button');if(b)pick(b.dataset.k||null)};pick(null);
/*build-engine*/
(function(){
const BU=window.BUILD||null,EF=14,EL=3.5,keys=Object.keys(G);
if(typeof mov==='undefined')window.mov=true;
const v3=new T.Vector3(),qa=new T.Quaternion(),qp=new T.Quaternion();
let ex=0,exT=(BU&&BU.explode)||0,exLast=-1,rank={},gap=EF*.11,expandH=0,prevMov=true,cl=[];
const baseCam=new T.Vector3();
// Gruplari gercek yuksekliklerine gore sirala (patlatilmis gorunum katmanlari)
(function(){const ry=pivot.rotation.y,rx=pivot.rotation.x;pivot.rotation.set(0,0,0);pivot.updateMatrixWorld(true);
 const cs=keys.map(g=>{let s=0,n=0;G[g].forEach(o=>{o.q.getWorldPosition(v3);s+=v3.y;n++});return{g,y:n?s/n:0}}).sort((a,b)=>a.y-b.y);
 cs.forEach((c,i)=>rank[c.g]=i);expandH=Math.max(0,cs.length-1)*gap;pivot.rotation.set(rx,ry,0);pivot.updateMatrixWorld(true)})();
// Parca etiketleri
const lg=new T.Group();pivot.add(lg);
const lname=g=>((INFO[g]&&INFO[g].n)||g).split(' (')[0].toLocaleUpperCase('tr');
function sprite(txt){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');
 x.fillStyle='rgba(8,48,120,.88)';x.fillRect(0,0,512,96);x.strokeStyle='#e8f3ff';x.lineWidth=3;x.strokeRect(2,2,508,92);
 x.fillStyle='#fff';x.font='bold 32px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,256,50);
 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(EF*.66,EF*.124,1);return sp}
function cent(g){const s=new T.Vector3();let n=0;G[g].forEach(o=>{o.q.getWorldPosition(v3);pivot.worldToLocal(v3);s.add(v3);n++});return n?s.divideScalar(n):s}
function callout(list){cl=list.slice();
 while(lg.children.length){const c=lg.children[0];lg.remove(c);if(c.geometry)c.geometry.dispose();if(c.material){if(c.material.map)c.material.map.dispose();c.material.dispose()}}
 list.forEach((g,i)=>{if(!G[g])return;const c=cent(g),d=new T.Vector3(c.x,0,c.z);if(d.length()<.5)d.set(1,0,.3);d.normalize();
  const lp=c.clone().add(d.multiplyScalar(EF*.55)).add(new T.Vector3(0,EF*(.2+.14*i),0)),sp=sprite(lname(g));sp.position.copy(lp);
  const ln=new T.Line(new T.BufferGeometry().setFromPoints([c,lp]),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthTest:false}));
  const dot=new T.Mesh(new T.SphereGeometry(EF*.02,10,8),new T.MeshBasicMaterial({color:0xffffff,depthTest:false}));dot.position.copy(c);
  lg.add(ln,sp,dot)})}
const _pick=pick;pick=function(k){_pick(k);if(!BU)callout(k?[k]:[])};
const _rs=rs;rs=function(){_rs();baseCam.copy(cam.position)};
// Patlat dugmesi (normal mod)
const bE=document.getElementById('bE');
if(bE)bE.onclick=()=>{exT=exT>0?0:1;bE.classList.toggle('on',exT>0);if(exT>0){prevMov=mov;mov=false}else{mov=prevMov}bE.textContent=exT>0?'\u2B0D TOPLA':'\u2B0D PATLAT'};
// Montaj modu
let state={},fade={},prevShow={},apply=()=>{};
if(BU){
 ['.card','.chips','.bar'].forEach(s=>{const e=document.querySelector(s);if(e)e.style.display='none'});
 mov=false;if(typeof mv!=='undefined')mv=0;auto=BU.rotate!==false;
 const top=document.querySelector('.top');if(top&&top.firstChild&&BU.title)top.firstChild.nodeValue=BU.title+' ';
 const hud=document.createElement('div');
 hud.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);color:#fff;font:600 13px monospace;letter-spacing:.06em;text-align:center;text-shadow:0 0 8px #9ccfff;pointer-events:none';
 document.body.appendChild(hud);
 const steps=BU.steps||[];let si=0;
 apply=function(i){si=i;const s=steps[i]||{},fo=s.focus||[],sh=s.show||[];
  keys.forEach(g=>{state[g]=fo.includes(g)?2:(sh.includes(g)?1:0);if(state[g]>0&&!prevShow[g])fade[g]=0;prevShow[g]=state[g]>0});
  hud.innerHTML='<div>ADIM '+(i+1)+' / '+steps.length+'</div><div style="font-size:15px">'+(s.t||'')+'</div><div style="height:4px;background:rgba(255,255,255,.2);margin:6px auto 0;max-width:320px"><div style="height:100%;background:#fff;width:'+Math.round((i+1)/steps.length*100)+'%"></div></div>';
  callout(fo)};
 apply(Math.max(0,Math.min(BU.idx||0,steps.length-1)));
 if(BU.autoplay&&steps.length>1)setInterval(()=>apply((si+1)%steps.length),BU.interval||3600);
}
window.__tick=function(t,dt){
 if(BU){
  if(BU.fixY!==undefined&&typeof robot!=='undefined')robot.position.y=BU.fixY;
  keys.forEach(g=>{const s=state[g]||0;fade[g]=Math.min(1,(fade[g]===undefined?1:fade[g])+dt/.9);const fa=fade[g];
   G[g].forEach(o=>{
    if(s===0){o.m.material.opacity=0;o.l.material.opacity=.09;o.l.material.color.copy(o.l.userData.c)}
    else if(s===1){o.m.material.opacity=o.m.userData.f*fa;o.l.material.opacity=.95*fa;o.l.material.color.copy(o.l.userData.c)}
    else{o.l.material.color.setHex(0xffffff);o.l.material.opacity=(.7+.3*Math.sin(t/180))*fa;o.m.material.opacity=Math.min(.6,o.m.userData.f*2+.15)*fa}})})}
 ex+=(exT-ex)*Math.min(1,dt*3);
