<div class="top">BLUEPRINT 3D · ALTI BACAKLI ROBOT<b id="deg">0°</b></div>
<div class="ui"><div class="card" id="card"></div><div class="chips" id="chips"></div><div class="bar"><button id="bR">⏸ DÖNÜŞ</button><button id="bM">⏸ YÜRÜ</button><button id="bE">⬍ PATLAT</button><button id="bF">◧ TEL KAFES</button></div><div class="ft">MERAL Robotik Kulübü</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,PI=Math.PI,cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene(),cam=new T.PerspectiveCamera(50,1,.1,400);
const pivot=new T.Group(),robot=new T.Group();pivot.add(robot);S.add(pivot);
const fills=[],AD=T.AdditiveBlending,G={};let cur='',par=robot;
const CY=0x66f0ff,AMB=0xffc933,WH=0xdfffff,GRN=0x3dffa0,ORG=0xff8a3a;
const bp=c=>{const k=new T.Color(c),l=.299*k.r+.587*k.g+.114*k.b;return new T.Color().setHSL(.6,.85,.58+.3*l)};
function part(g,c,x=0,y=0,z=0,o={}){c=bp(c);const q=new T.Group();
 const m=new T.Mesh(g,new T.MeshBasicMaterial({color:c,transparent:true,opacity:(o.f??.2)*.8,blending:AD,depthWrite:false,side:T.DoubleSide}));
 const l=new T.LineSegments(new T.EdgesGeometry(g,28),new T.LineBasicMaterial({color:c,transparent:true,opacity:.95,blending:AD}));
 q.add(m,l);q.position.set(x,y,z);if(o.r)q.rotation.set(...o.r);const w=new T.Group();w.add(q);(o.p||par).add(w);fills.push(m);m.userData.f=m.material.opacity;l.userData.c=l.material.color.clone();(G[cur]=G[cur]||[]).push({m,l,q,w});return q}
const B=(a,b,c)=>new T.BoxGeometry(a,b,c),C=(r,h,s=24)=>new T.CylinderGeometry(r,r,h,s);
const J=(p,x,y,z)=>{const g=new T.Group();g.position.set(x,y,z);p.add(g);return g};
function ext(pts,d,bev){const s=new T.Shape(pts.map(p=>new T.Vector2(p[0],p[1])));
 const g=new T.ExtrudeGeometry(s,bev?{depth:d,bevelEnabled:true,bevelThickness:bev,bevelSize:bev*1.2,bevelSegments:2}:{depth:d,bevelEnabled:false});g.rotateX(PI/2);return g}
const hex=k=>[[-3.5*k,-6*k],[3.5*k,-6*k],[6.5*k,0],[3.5*k,6*k],[-3.5*k,6*k],[-6.5*k,0]];
function blade(){const up=[],dn=[],n=14;for(let i=0;i<=n;i++){const t=i/n,x=.6+9.2*t,y=-8.4*Math.pow(t,1.7),t2=Math.min(1,t+.02),x2=.6+9.2*t2,y2=-8.4*Math.pow(t2,1.7),dx=x2-x,dy=y2-y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,w=1.5*Math.pow(1-t,.7)+.08;up.push([x+nx*w,y+ny*w]);dn.push([x-nx*w,y-ny*w])}
 const s=new T.Shape(up.concat(dn.reverse()).map(p=>new T.Vector2(p[0],p[1])));const g=new T.ExtrudeGeometry(s,{depth:1.2,bevelEnabled:false});g.translate(0,0,-.6);return g}
const BG=blade();
// Gövde
cur='shell';
part(ext(hex(1),1.8,.5),CY,0,5.4,0,{f:.22});part(ext(hex(.68),.4,.3),CY,0,6.5,0,{f:.28});part(ext(hex(.95),.3),CY,0,3.3,0,{f:.25});
for(let i=-2;i<=2;i++)part(B(.4,.5,.2),WH,i*.9,4.4,6.3,{f:.6});
part(B(1.2,.6,.3),WH,3.2,4.6,6.2,{f:.5});
cur='antenna';
part(C(.45,.6,16),WH,0,6.9,-5.2,{f:.4});part(C(.14,5,8),WH,0,9.5,-5.2,{f:.6});part(new T.SphereGeometry(.3,10,8),WH,0,12.1,-5.2,{f:.7});
cur='elec';
part(B(7,.2,8.5),GRN,0,4,-.3,{f:.4});part(B(5,.2,2.2),GRN,0,4.8,1.4,{f:.4});part(B(2,.25,3),0x4d7cff,0,4.3,2.6,{f:.5});
part(B(4.5,1.5,2.8),AMB,0,4.1,-3.2,{f:.3});
[-1,0,1].forEach(i=>part(B(.3,.2,.3),0xff3d3d,i*.7,5,2.4,{f:.8}));
// Bacaklar
const legs=[];
function leg(px,pz,dx,dz,side,grp){
 const L=J(robot,px,0,pz);L.rotation.y=Math.atan2(-dz,dx);
 cur='hip';part(B(3.2,2.6,2.6),AMB,.2,4,0,{p:L,f:.3});part(C(.75,.3,16),WH,1.4,5.45,0,{p:L,f:.5});
 cur='wire';
 const cu=n=>new T.CatmullRomCurve3(n.map(a=>new T.Vector3(...a)));
 part(new T.TubeGeometry(cu([[.2,3.2,1.3],[-1,3.8,2.4],[-2.6,4.4,1.6]]),16,.09,6),ORG,0,0,0,{p:L,f:.8});
 const cx=J(L,1.4,5.45,0);
 cur='bracket';part(B(2.6,3.2,3.2),CY,.5,1.6,0,{p:cx,f:.3});
 [-1,1].forEach(s=>part(B(3.2,4.2,.4),CY,1.2,2.5,s*1.4,{p:cx,f:.3}));
 cur='knee';part(B(2.4,2.2,2.4),AMB,.3,3,0,{p:cx,f:.3});
 [-1,1].forEach(s=>part(C(.9,.3,16),WH,2.1,3,s*1.75,{p:cx,r:[PI/2,0,0],f:.5}));
 cur='wire';part(new T.TubeGeometry(cu([[.3,3,1.3],[-.6,2.2,1.9],[-1.2,.8,1.6]]),16,.09,6),ORG,0,0,0,{p:cx,f:.8});
 const fm=J(cx,2.1,3,0);cur='claw';
 part(BG,CY,0,0,0,{p:fm,f:.3});part(C(1.1,1.3,20),WH,0,0,0,{p:fm,r:[PI/2,0,0],f:.35});
 legs.push({cx,fm,side,grp})}
leg(6.1,0,1,0,1,1);leg(4.2,3.8,.75,.66,1,0);leg(4.2,-3.8,.75,-.66,1,0);
leg(-6.1,0,-1,0,-1,0);leg(-4.2,3.8,-.75,.66,-1,1);leg(-4.2,-3.8,-.75,-.66,-1,1);
// Sahne
const gr=new T.GridHelper(100,50,0x9ccfff,0x3a78d8);gr.material.transparent=true;gr.material.opacity=.35;S.add(gr);
[24,30,36].forEach((r,i)=>{const m=new T.Mesh(new T.RingGeometry(r,r+.2,128),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.7-i*.2,blending:AD,side:T.DoubleSide}));m.rotation.x=-PI/2;S.add(m)});
const tk=[];for(let i=0;i<72;i++){const a=i/72*2*PI,l=i%6?.8:1.8;tk.push(Math.cos(a)*31,0,Math.sin(a)*31,Math.cos(a)*(31+l),0,Math.sin(a)*(31+l))}
const tg=new T.BufferGeometry();tg.setAttribute('position',new T.Float32BufferAttribute(tk,3));S.add(new T.LineSegments(tg,new T.LineBasicMaterial({color:0xd6ebff,transparent:true,opacity:.6})));
const mk=new T.Mesh(new T.ConeGeometry(.9,1.8,3),new T.MeshBasicMaterial({color:0xffffff,blending:AD}));mk.rotation.x=PI;S.add(mk);
const pd=new T.Mesh(C(24,.3,96),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.08,blending:AD,depthWrite:false}));pd.position.y=-.2;S.add(pd);
const og=new T.Group(),oM=new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.6,blending:AD,side:T.DoubleSide});for(let i=0;i<20;i++)og.add(new T.Mesh(new T.RingGeometry(41,41.4,10,1,i/20*2*PI,2*PI/20*.6),oM));og.rotation.x=-PI/2;S.add(og);
const beam=new T.Mesh(new T.CylinderGeometry(22,26,26,64,1,true),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.04,blending:AD,side:T.DoubleSide,depthWrite:false}));beam.position.y=13;S.add(beam);
const sr=new T.Mesh(new T.TorusGeometry(22,.1,8,128),new T.MeshBasicMaterial({color:0xe8f3ff,blending:AD}));sr.rotation.x=PI/2;S.add(sr);
const N=260,pp=new Float32Array(N*3);for(let i=0;i<N;i++){const a=Math.random()*2*PI,r=Math.random()*26;pp.set([Math.cos(a)*r,Math.random()*26,Math.sin(a)*r],i*3)}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pp,3));S.add(new T.Points(pg,new T.PointsMaterial({color:0xd6ebff,size:.3,transparent:true,opacity:.8,blending:AD})));
// Etkileşim
let auto=true,mov=true,drag=false,lx=0,ly=0,wire=false,tgt=null,sk=null;pivot.rotation.x=.2;
cv.onpointerdown=e=>{tgt=null;drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)};
cv.onpointerup=cv.onpointercancel=()=>drag=false;
cv.onpointermove=e=>{if(!drag)return;pivot.rotation.y+=(e.clientX-lx)*.01;pivot.rotation.x=Math.max(-.2,Math.min(.9,pivot.rotation.x+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY};
bR.onclick=()=>{auto=!auto;if(auto)tgt=null;bR.textContent=auto?'⏸ DÖNÜŞ':'▶ DÖNÜŞ'};
bM.onclick=()=>{mov=!mov;bM.textContent=mov?'⏸ YÜRÜ':'▶ YÜRÜ'};
bF.onclick=()=>{wire=!wire;fills.forEach(m=>m.visible=!wire);bF.textContent=wire?'◨ DOLU':'◧ TEL KAFES'};
const INFO={
shell:{n:'Gövde Kabuğu',y:.5,x:.65,t:'Altıgen, siyah kabuk (görünüşe göre 3D baskı). Elektronik kartları ve bataryayı korur. Ön yüzde havalandırma ve port delikleri, yanlarında bacak servolarının bağlandığı çıkıntılar bulunur.'},
elec:{n:'Elektronik Kart ve Batarya',y:.4,x:.9,t:'Kabuğun içinde denetleyici kart, servo sürücü ve batarya yer alır. Denetleyici yürüyüş komutlarını servolara iletir; kart modeli fotoğraftan anlaşılmıyor, projeye göre değişir. (Modeldeki iç parçalar tahminidir.)'},
antenna:{n:'Anten',y:2.6,x:.3,t:'Kablosuz bağlantı için dışarı çıkan anten (Wi-Fi, Bluetooth veya RF modülü olabilir). Robotun telefon ya da kumandadan komut almasını sağlar; modül tipi fotoğraftan anlaşılmıyor.'},
hip:{n:'Kalça Servoları (yatay hareket)',y:.8,x:.5,t:'Her bacağın gövdeye bağlandığı servo. Bacağı öne arkaya savurur. Fotoğrafta bacak başına iki servo görünüyor, yani toplam 12 servo.'},
bracket:{n:'Bacak Braketi',y:.9,x:.35,t:'Kalça servosunun üzerine oturan dikey siyah gövde. Diz servosunu iki yanağıyla tutar ve pençe bacağı taşır.'},
knee:{n:'Diz Servoları (dikey hareket)',y:.7,x:.35,t:'Pençe bacağı yukarı kaldırıp indirir. Tripod yürüyüşte üç bacak havadayken diğer üçü zeminde gövdeyi taşır.'},
claw:{n:'Pençe Bacaklar',y:-.5,x:.25,t:'Kavisli, ucu sivrilen bacaklar zeminde ince bir temas noktası oluşturur. Kavis, bacağın menzilini artırır ve robotun yerden yüksekte durmasını sağlar.'},
wire:{n:'Servo Kabloları',y:.7,x:.45,t:'Her servoyu karta bağlayan üçlü kablolar: çoğu servoda turuncu sinyal, kırmızı güç, kahverengi topraktır. Eklemler hareket ettiği için kablolar biraz gevşek bırakılır.'}};
function hl(k){Object.keys(G).forEach(g=>G[g].forEach(o=>{const on=!k||g===k;o.m.material.opacity=k?(on?Math.min(.75,o.m.userData.f*2.2+.2):o.m.userData.f*.2):o.m.userData.f;o.l.material.color.copy(k&&on?new T.Color(0xffffff):o.l.userData.c);o.l.material.opacity=k&&!on?.2:.95}))}
function pick(k){sk=k;hl(k);document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.k===(k||'')));
 if(!k){card.innerHTML='Bir parça seçerek tanıtımını oku. Robot o parçaya döner.';tgt=null;auto=true;mov=true;bR.textContent='⏸ DÖNÜŞ';bM.textContent='⏸ YÜRÜ';return}
 const d=INFO[k];card.innerHTML='<b>'+d.n+'</b>'+d.t;tgt={y:d.y,x:d.x};auto=false;mov=false;bR.textContent='▶ DÖNÜŞ';bM.textContent='▶ YÜRÜ'}
chips.innerHTML='<button data-k="" class="on">TÜMÜ</button>'+Object.keys(INFO).map(k=>'<button data-k="'+k+'">'+INFO[k].n.split(' (')[0]+'</button>').join('');
chips.onclick=e=>{const b=e.target.closest('button');if(b)pick(b.dataset.k||null)};pick(null);
/*build-engine*/
(function(){
const BU=window.BUILD||null,EF=22,EL=4,keys=Object.keys(G);
if(typeof mov==='undefined')window.mov=true;
const v3=new T.Vector3(),qa=new T.Quaternion(),qp=new T.Quaternion();
let ex=0,exT=(BU&&BU.explode)||0,exLast=-1,rank={},gap=EF*.11,expandH=0,prevMov=true,cl=[];
const baseCam=new T.Vector3();
// Gruplari gercek yuksekliklerine gore sirala (patlatilmis gorunum katmanlari)
(function(){const ry=pivot.rotation.y,rx=pivot.rotation.x;pivot.rotation.set(0,0,0);pivot.updateMatrixWorld(true);
 const cs=keys.map(g=>{let s=0,n=0;G[g].forEach(o=>{o.q.getWorldPosition(v3);s+=v3.y;n++});return{g,y:n?s/n:0}}).sort((a,b)=>a.y-b.y);
 cs.forEach((c,i)=>rank[c.g]=i);expandH=Math.max(0,cs.length-1)*gap;pivot.rotation.set(rx,ry,0);pivot.updateMatrixWorld(true)})();
// Parca etiketleri
const lg=new T.Group();pivot.add(lg);
const lname=g=>((INFO[g]&&INFO[g].n)||g).split(' (')[0].toLocaleUpperCase('tr');
function sprite(txt){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');
 x.fillStyle='rgba(8,48,120,.88)';x.fillRect(0,0,512,96);x.strokeStyle='#e8f3ff';x.lineWidth=3;x.strokeRect(2,2,508,92);
 x.fillStyle='#fff';x.font='bold 32px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,256,50);
 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(EF*.66,EF*.124,1);return sp}
function cent(g){const s=new T.Vector3();let n=0;G[g].forEach(o=>{o.q.getWorldPosition(v3);pivot.worldToLocal(v3);s.add(v3);n++});return n?s.divideScalar(n):s}
function callout(list){cl=list.slice();
 while(lg.children.length){const c=lg.children[0];lg.remove(c);if(c.geometry)c.geometry.dispose();if(c.material){if(c.material.map)c.material.map.dispose();c.material.dispose()}}
 list.forEach((g,i)=>{if(!G[g])return;const c=cent(g),d=new T.Vector3(c.x,0,c.z);if(d.length()<.5)d.set(1,0,.3);d.normalize();
  const lp=c.clone().add(d.multiplyScalar(EF*.55)).add(new T.Vector3(0,EF*(.2+.14*i),0)),sp=sprite(lname(g));sp.position.copy(lp);
  const ln=new T.Line(new T.BufferGeometry().setFromPoints([c,lp]),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthTest:false}));
  const dot=new T.Mesh(new T.SphereGeometry(EF*.02,10,8),new T.MeshBasicMaterial({color:0xffffff,depthTest:false}));dot.position.copy(c);
  lg.add(ln,sp,dot)})}
const _pick=pick;pick=function(k){_pick(k);if(!BU)callout(k?[k]:[])};
const _rs=rs;rs=function(){_rs();baseCam.copy(cam.position)};
// Patlat dugmesi (normal mod)
const bE=document.getElementById('bE');
if(bE)bE.onclick=()=>{exT=exT>0?0:1;bE.classList.toggle('on',exT>0);if(exT>0){prevMov=mov;mov=false}else{mov=prevMov}bE.textContent=exT>0?'\u2B0D TOPLA':'\u2B0D PATLAT'};
// Montaj modu
let state={},fade={},prevShow={},apply=()=>{};
if(BU){
 ['.card','.chips','.bar'].forEach(s=>{const e=document.querySelector(s);if(e)e.style.display='none'});
 mov=false;if(typeof mv!=='undefined')mv=0;auto=BU.rotate!==false;
 const top=document.querySelector('.top');if(top&&top.firstChild&&BU.title)top.firstChild.nodeValue=BU.title+' ';
 const hud=document.createElement('div');
 hud.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);color:#fff;font:600 13px monospace;letter-spacing:.06em;text-align:center;text-shadow:0 0 8px #9ccfff;pointer-events:none';
 document.body.appendChild(hud);
 const steps=BU.steps||[];let si=0;
 apply=function(i){si=i;const s=steps[i]||{},fo=s.focus||[],sh=s.show||[];
  keys.forEach(g=>{state[g]=fo.includes(g)?2:(sh.includes(g)?1:0);if(state[g]>0&&!prevShow[g])fade[g]=0;prevShow[g]=state[g]>0});
  hud.innerHTML='<div>ADIM '+(i+1)+' / '+steps.length+'</div><div style="font-size:15px">'+(s.t||'')+'</div><div style="height:4px;background:rgba(255,255,255,.2);margin:6px auto 0;max-width:320px"><div style="height:100%;background:#fff;width:'+Math.round((i+1)/steps.length*100)+'%"></div></div>';
  callout(fo)};
 apply(Math.max(0,Math.min(BU.idx||0,steps.length-1)));
 if(BU.autoplay&&steps.length>1)setInterval(()=>apply((si+1)%steps.length),BU.interval||3600);
}
window.__tick=function(t,dt){
 if(BU){
  if(BU.fixY!==undefined&&typeof robot!=='undefined')robot.position.y=BU.fixY;
  keys.forEach(g=>{const s=state[g]||0;fade[g]=Math.min(1,(fade[g]===undefined?1:fade[g])+dt/.9);const fa=fade[g];
   G[g].forEach(o=>{
    if(s===0){o.m.material.opacity=0;o.l.material.opacity=.09;o.l.material.color.copy(o.l.userData.c)}
    else if(s===1){o.m.material.opacity=o.m.userData.f*fa;o.l.material.opacity=.95*fa;o.l.material.color.copy(o.l.userData.c)}
    else{o.l.material.color.setHex(0xffffff);o.l.material.opacity=(.7+.3*Math.sin(t/180))*fa;o.m.material.opacity=Math.min(.6,o.m.userData.f*2+.15)*fa}})})}
 ex+=(exT-ex)*Math.min(1,dt*3);
