const tk=[];for(let i=0;i<72;i++){const a=i/72*2*PI,l=i%6?.5:1.2;tk.push(Math.cos(a)*12.4,0,Math.sin(a)*12.4,Math.cos(a)*(12.4+l),0,Math.sin(a)*(12.4+l))}

const N=180,pp=new Float32Array(N*3);for(let i=0;i<N;i++){const a=Math.random()*2*PI,r=Math.random()*11;pp.set([Math.cos(a)*r,Math.random()*14,Math.sin(a)*r],i*3)}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pp,3));S.add(new T.Points(pg,new T.PointsMaterial({color:0xd6ebff,size:.12,transparent:true,opacity:.8,blending:AD})));

 apply(Math.max(0,Math.min(BU.idx||0,steps.length-1)));
