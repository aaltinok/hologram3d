<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,PI=Math.PI,cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.1,300);
const pivot=new T.Group(),arm=new T.Group();pivot.add(arm);S.add(pivot);
const fills=[],AD=T.AdditiveBlending,G={};let cur='',par=arm;
const BLUE=0x2aa8ff,AMB=0xffc933,PALE=0xaaf0ff,WH=0xdfffff;
const bp=c=>{const k=new T.Color(c),l=.299*k.r+.587*k.g+.114*k.b;return new T.Color().setHSL(.6,.85,.58+.3*l)};
function part(g,c,x=0,y=0,z=0,o={}){c=bp(c);const q=new T.Group();
 const m=new T.Mesh(g,new T.MeshBasicMaterial({color:c,transparent:true,opacity:(o.f??.2)*.8,blending:AD,depthWrite:false,side:T.DoubleSide}));
 const l=new T.LineSegments(new T.EdgesGeometry(g,28),new T.LineBasicMaterial({color:c,transparent:true,opacity:.95,blending:AD}));
 q.add(m,l);q.position.set(x,y,z);if(o.r)q.rotation.set(...o.r);const w=new T.Group();w.add(q);(o.p||par).add(w);fills.push(m);m.userData.f=m.material.opacity;l.userData.c=l.material.color.clone();(G[cur]=G[cur]||[]).push({m,l,q,w});return q}
const B=(a,b,c)=>new T.BoxGeometry(a,b,c),C=(r,h,s=24)=>new T.CylinderGeometry(r,r,h,s);
const J=(p,x,y,z)=>{const g=new T.Group();g.position.set(x,y,z);p.add(g);return g};
function ext(pts,d,holes=[]){const s=new T.Shape(pts.map(p=>new T.Vector2(p[0],p[1])));
 holes.forEach(h=>s.holes.push(new T.Path(h.map(a=>new T.Vector2(a[0],a[1])))));
 const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:false});g.rotateX(PI/2);return g}
const oct=r=>{const a=r*.65;return[[-a,-r],[a,-r],[r,-a],[r,a],[a,r],[-a,r],[-r,a],[-r,-a]]};
function hub(x,y,z){part(C(1.05,.35,20),WH,x,y,z,{r:[0,0,PI/2],f:.4});for(let i=0;i<6;i++){const a=i/6*2*PI;part(C(.16,.45,8),0xffffff,x,y+Math.cos(a)*.7,z+Math.sin(a)*.7,{r:[0,0,PI/2],f:.6})}}
// Taban
cur='base';
part(ext(oct(8.5),.3,[[[3.2,-6],[3.8,-6],[3.8,-1],[3.2,-1]],[[-3.8,-6],[-3.2,-6],[-3.2,-1],[-3.8,-1]]]),BLUE,0,1.5,0,{f:.28});
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{part(new T.CylinderGeometry(1.5,1.1,.9,16),PALE,s[0]*6.4,.5,s[1]*6.4,{f:.3});part(C(.4,4.2,12),WH,s[0]*5.2,3.6,s[1]*5.2,{f:.35})});
part(ext(oct(8),.3),BLUE,0,5.9,0,{f:.28});
// Dönel tabla + taban servosu
cur='turn';
part(C(5.6,.5,48),WH,0,6.15,0,{f:.3});part(C(4.6,.15,48),BLUE,0,6.5,0,{f:.4});
part(B(3.2,3.9,2.4),AMB,0,3.55,0,{f:.3});part(C(.7,.3,16),WH,0,5.7,0,{f:.5});
// Kontrol kartı
cur='ctrl';
part(B(3.6,.2,5),0x3dffa0,3.9,2.2,0,{f:.4});part(B(1,.2,1),PALE,3.5,2.4,0,{f:.6});
for(let i=0;i<6;i++)part(B(.3,.8,.3),0xffd23a,5.3,2.7,-2+i*.8);
part(B(.3,.2,.3),0xff3d3d,2.6,2.4,1.8,{f:.8});
// Dönen gövde
const trn=J(arm,0,6.6,0);par=trn;
cur='shoulder';
part(B(6,.3,5.2),BLUE,0,.15,0,{f:.3});
[-1,1].forEach(s=>{part(B(.3,6.2,5.2),BLUE,s*2.9,3.2,0,{f:.3});hub(s*3.15,5.4,0)});
part(B(4.4,2.4,4),AMB,0,5.4,0,{f:.3});
const sh=J(trn,0,5.4,0);par=sh;
cur='upper';
[-1,1].forEach(s=>part(B(.3,8.4,3.2),BLUE,s*2.3,3.4,0,{f:.3}));
part(B(3.6,5.4,2.4),AMB,0,3.2,0,{f:.28});
cur='elbow';
part(B(3.8,2.4,3),AMB,0,7.2,0,{f:.3});[-1,1].forEach(s=>hub(s*2.65,7.2,0));
const el=J(sh,0,7.2,0);par=el;
cur='forearm';
[-1,1].forEach(s=>part(B(.3,6.4,3),BLUE,s*2.3,2.6,0,{f:.3}));
part(B(3.2,3.6,2.2),AMB,0,2,0,{f:.28});part(B(3.6,2.4,3),AMB,0,5.6,0,{f:.3});
cur='wrist';
[-1,1].forEach(s=>hub(s*2.65,5.6,0));
const wr=J(el,0,5.6,0);par=wr;
[-1,1].forEach(s=>part(B(.3,4.6,2.6),BLUE,s*2,1.7,0,{f:.3}));
part(B(2.4,3.6,2.4),AMB,0,1.5,0,{f:.3});
const rl=J(wr,0,3.8,0);par=rl;
part(C(1.4,.4,20),WH,0,.2,0,{f:.4});
cur='gripper';
[-1,1].forEach(s=>part(B(.3,4,5.2),PALE,s*1.9,2.4,.2,{f:.3}));
part(B(2.4,3,3.6),AMB,0,2.1,-.2,{f:.3});part(B(4,.4,1.4),PALE,0,.7,1.8,{f:.3});
const fg=[-1,1].map(s=>{const f=J(rl,s*1.4,4.4,.2);par=f;part(B(.5,4.2,1.4),PALE,0,2.1,0,{f:.4});part(B(.3,2,1.6),AMB,-s*.4,3.3,0,{f:.6});return f});
// Sahne
const gr=new T.GridHelper(56,28,0x9ccfff,0x3a78d8);gr.material.transparent=true;gr.material.opacity=.4;S.add(gr);
[10,14,18].forEach((r,i)=>{const m=new T.Mesh(new T.RingGeometry(r,r+.14,96),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.7-i*.2,blending:AD,side:T.DoubleSide}));m.rotation.x=-PI/2;S.add(m)});
const tk=[];for(let i=0;i<72;i++){const a=i/72*2*PI,l=i%6?.6:1.4;tk.push(Math.cos(a)*15,0,Math.sin(a)*15,Math.cos(a)*(15+l),0,Math.sin(a)*(15+l))}
const tg=new T.BufferGeometry();tg.setAttribute('position',new T.Float32BufferAttribute(tk,3));S.add(new T.LineSegments(tg,new T.LineBasicMaterial({color:0xd6ebff,transparent:true,opacity:.6})));
const mk=new T.Mesh(new T.ConeGeometry(.6,1.2,3),new T.MeshBasicMaterial({color:0xffffff,blending:AD}));mk.rotation.x=PI;S.add(mk);
const pd=new T.Mesh(C(11,.3,64),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.1,blending:AD,depthWrite:false}));pd.position.y=-.2;S.add(pd);
const pe=new T.LineSegments(new T.EdgesGeometry(C(11,.3,64),20),new T.LineBasicMaterial({color:0xd6ebff,transparent:true,opacity:.8}));pe.position.y=-.2;S.add(pe);
const og=new T.Group(),oM=new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.6,blending:AD,side:T.DoubleSide});for(let i=0;i<18;i++)og.add(new T.Mesh(new T.RingGeometry(21,21.3,10,1,i/18*2*PI,2*PI/18*.6),oM));og.rotation.x=-PI/2;S.add(og);
const beam=new T.Mesh(new T.CylinderGeometry(11,13,30,48,1,true),new T.MeshBasicMaterial({color:0x9ccfff,transparent:true,opacity:.045,blending:AD,side:T.DoubleSide,depthWrite:false}));beam.position.y=15;S.add(beam);
const sr=new T.Mesh(new T.TorusGeometry(11,.06,8,96),new T.MeshBasicMaterial({color:0xe8f3ff,blending:AD}));sr.rotation.x=PI/2;S.add(sr);
const N=220,pp=new Float32Array(N*3);for(let i=0;i<N;i++){const a=Math.random()*2*PI,r=Math.random()*12;pp.set([Math.cos(a)*r,Math.random()*30,Math.sin(a)*r],i*3)}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pp,3));S.add(new T.Points(pg,new T.PointsMaterial({color:0xd6ebff,size:.16,transparent:true,opacity:.8,blending:AD})));
// Etkileşim
let auto=true,mov=true,drag=false,lx=0,ly=0,wire=false,tgt=null,sk=null;pivot.rotation.x=.15;
cv.onpointerdown=e=>{tgt=null;drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)};
cv.onpointerup=cv.onpointercancel=()=>drag=false;
cv.onpointermove=e=>{if(!drag)return;pivot.rotation.y+=(e.clientX-lx)*.01;pivot.rotation.x=Math.max(-.3,Math.min(.7,pivot.rotation.x+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY};
bR.onclick=()=>{auto=!auto;if(auto)tgt=null;bR.textContent=auto?'⏸ DÖNÜŞ':'▶ DÖNÜŞ'};
bM.onclick=()=>{mov=!mov;bM.textContent=mov?'⏸ HAREKET':'▶ HAREKET'};
bF.onclick=()=>{wire=!wire;fills.forEach(m=>m.visible=!wire);bF.textContent=wire?'◨ DOLU':'◧ TEL KAFES'};
const INFO={
base:{n:'Taban Plakası ve Vantuzlar',y:.6,x:.6,t:'Metal taban plakası kolu dengeler; köşelerdeki vantuzlar robotu masaya sabitler. Dört ara ayak alt ve üst plakayı birbirine bağlar, aradaki servo ile kartı korur.'},
turn:{n:'Dönel Tabla ve Taban Servosu (1. eksen)',y:.5,x:.55,t:'Tablanın altındaki servo kolu sağa sola döndürür. Yatak, ağır kol yükünü taşırken tablanın sürtünmesiz dönmesini sağlar.'},
ctrl:{n:'Kontrol Kartı',y:-1.3,x:.3,t:'Servolara komut gönderen ve güç dağıtan kart. Bilgisayar, telefon veya Arduino gibi bir denetleyiciden gelen komutları servolara iletir; kart modeli kite göre değişir.'},
shoulder:{n:'Omuz Eklemi (2. eksen)',y:1.2,x:.2,t:'Servo kolu öne arkaya kaldırır. U şeklindeki metal braket servo eksenini iki taraftan tutarak yükü taşır; vidalı göbekler dönme eksenini gösterir.'},
upper:{n:'Üst Kol',y:.9,x:.2,t:'Omuz ile dirsek arasındaki bağlantı. Mavi braketler servo gövdesini tutar; kolun uzanma mesafesini belirler.'},
elbow:{n:'Dirsek Eklemi (3. eksen)',y:1.2,x:.2,t:'Ön kolu üst kola göre büker. Omuzla birlikte çalışarak tutucuyu hedefe yaklaştırır veya uzaklaştırır.'},
forearm:{n:'Ön Kol',y:1,x:.2,t:'Dirsek ile bilek arasında yer alır ve ucundaki bilek servosunu taşır. Uzunluğu çalışma alanını belirler.'},
wrist:{n:'Bilek (4. ve 5. eksen)',y:.9,x:.25,t:'Önce yukarı aşağı eğilme (pitch), sonra kendi ekseni etrafında dönme (roll) hareketi verir. Tutucu nesneye istenen açıyla yaklaşır.'},
gripper:{n:'Tutucu / Gripper (6. eksen)',y:.4,x:.3,t:'Bir servo iki parmağı açıp kapatır; parmak uçlarındaki pedler nesneyi kavrar. Hafif nesneleri almak ve bırakmak için kullanılır.'}};
function hl(k){Object.keys(G).forEach(g=>G[g].forEach(o=>{const on=!k||g===k;o.m.material.opacity=k?(on?Math.min(.75,o.m.userData.f*2.2+.2):o.m.userData.f*.2):o.m.userData.f;o.l.material.color.copy(k&&on?new T.Color(0xffffff):o.l.userData.c);o.l.material.opacity=k&&!on?.2:.95}))}
function pick(k){sk=k;hl(k);document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.k===(k||'')));
 if(!k){card.innerHTML='Bir parça seçerek tanıtımını oku. Robot o parçaya döner.';tgt=null;auto=true;mov=true;bR.textContent='⏸ DÖNÜŞ';bM.textContent='⏸ HAREKET';return}
 const d=INFO[k];card.innerHTML='<b>'+d.n+'</b>'+d.t;tgt={y:d.y,x:d.x};auto=false;mov=false;bR.textContent='▶ DÖNÜŞ';bM.textContent='▶ HAREKET'}
chips.innerHTML='<button data-k="" class="on">TÜMÜ</button>'+Object.keys(INFO).map(k=>'<button data-k="'+k+'">'+INFO[k].n.split(' (')[0]+'</button>').join('');
chips.onclick=e=>{const b=e.target.closest('button');if(b)pick(b.dataset.k||null)};pick(null);
/*build-engine*/
(function(){
const BU=window.BUILD||null,EF=15,EL=10,keys=Object.keys(G);
if(typeof mov==='undefined')window.mov=true;
const v3=new T.Vector3(),qa=new T.Quaternion(),qp=new T.Quaternion();
let ex=0,exT=(BU&&BU.explode)||0,exLast=-1,rank={},gap=EF*.11,expandH=0,prevMov=true,cl=[];
const baseCam=new T.Vector3();
// Gruplari gercek yuksekliklerine gore sirala (patlatilmis gorunum katmanlari)
(function(){const ry=pivot.rotation.y,rx=pivot.rotation.x;pivot.rotation.set(0,0,0);pivot.updateMatrixWorld(true);
 const cs=keys.map(g=>{let s=0,n=0;G[g].forEach(o=>{o.q.getWorldPosition(v3);s+=v3.y;n++});return{g,y:n?s/n:0}}).sort((a,b)=>a.y-b.y);
 cs.forEach((c,i)=>rank[c.g]=i);expandH=Math.max(0,cs.length-1)*gap;pivot.rotation.set(rx,ry,0);pivot.updateMatrixWorld(true)})();
// Parca etiketleri
const lg=new T.Group();pivot.add(lg);
const lname=g=>((INFO[g]&&INFO[g].n)||g).split(' (')[0].toLocaleUpperCase('tr');
function sprite(txt){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');
 x.fillStyle='rgba(8,48,120,.88)';x.fillRect(0,0,512,96);x.strokeStyle='#e8f3ff';x.lineWidth=3;x.strokeRect(2,2,508,92);
 x.fillStyle='#fff';x.font='bold 32px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,256,50);
 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(EF*.66,EF*.124,1);return sp}
function cent(g){const s=new T.Vector3();let n=0;G[g].forEach(o=>{o.q.getWorldPosition(v3);pivot.worldToLocal(v3);s.add(v3);n++});return n?s.divideScalar(n):s}
function callout(list){cl=list.slice();
 while(lg.children.length){const c=lg.children[0];lg.remove(c);if(c.geometry)c.geometry.dispose();if(c.material){if(c.material.map)c.material.map.dispose();c.material.dispose()}}
 list.forEach((g,i)=>{if(!G[g])return;const c=cent(g),d=new T.Vector3(c.x,0,c.z);if(d.length()<.5)d.set(1,0,.3);d.normalize();
  const lp=c.clone().add(d.multiplyScalar(EF*.55)).add(new T.Vector3(0,EF*(.2+.14*i),0)),sp=sprite(lname(g));sp.position.copy(lp);
  const ln=new T.Line(new T.BufferGeometry().setFromPoints([c,lp]),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthTest:false}));
  const dot=new T.Mesh(new T.SphereGeometry(EF*.02,10,8),new T.MeshBasicMaterial({color:0xffffff,depthTest:false}));dot.position.copy(c);
  lg.add(ln,sp,dot)})}
const _pick=pick;pick=function(k){_pick(k);if(!BU)callout(k?[k]:[])};
const _rs=rs;rs=function(){_rs();baseCam.copy(cam.position)};
// Patlat dugmesi (normal mod)
const bE=document.getElementById('bE');
if(bE)bE.onclick=()=>{exT=exT>0?0:1;bE.classList.toggle('on',exT>0);if(exT>0){prevMov=mov;mov=false}else{mov=prevMov}bE.textContent=exT>0?'\u2B0D TOPLA':'\u2B0D PATLAT'};
// Montaj modu
let state={},fade={},prevShow={},apply=()=>{};
if(BU){
 ['.card','.chips','.bar'].forEach(s=>{const e=document.querySelector(s);if(e)e.style.display='none'});
 mov=false;if(typeof mv!=='undefined')mv=0;auto=BU.rotate!==false;
 const top=document.querySelector('.top');if(top&&top.firstChild&&BU.title)top.firstChild.nodeValue=BU.title+' ';
 const hud=document.createElement('div');
 hud.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);color:#fff;font:600 13px monospace;letter-spacing:.06em;text-align:center;text-shadow:0 0 8px #9ccfff;pointer-events:none';
 document.body.appendChild(hud);
 const steps=BU.steps||[];let si=0;
 apply=function(i){si=i;const s=steps[i]||{},fo=s.focus||[],sh=s.show||[];
  keys.forEach(g=>{state[g]=fo.includes(g)?2:(sh.includes(g)?1:0);if(state[g]>0&&!prevShow[g])fade[g]=0;prevShow[g]=state[g]>0});
  hud.innerHTML='<div>ADIM '+(i+1)+' / '+steps.length+'</div><div style="font-size:15px">'+(s.t||'')+'</div><div style="height:4px;background:rgba(255,255,255,.2);margin:6px auto 0;max-width:320px"><div style="height:100%;background:#fff;width:'+Math.round((i+1)/steps.length*100)+'%"></div></div>';
  callout(fo)};
 apply(Math.max(0,Math.min(BU.idx||0,steps.length-1)));
 if(BU.autoplay&&steps.length>1)setInterval(()=>apply((si+1)%steps.length),BU.interval||3600);
}
window.__tick=function(t,dt){
 if(BU){
  if(BU.fixY!==undefined&&typeof robot!=='undefined')robot.position.y=BU.fixY;
  keys.forEach(g=>{const s=state[g]||0;fade[g]=Math.min(1,(fade[g]===undefined?1:fade[g])+dt/.9);const fa=fade[g];
   G[g].forEach(o=>{
    if(s===0){o.m.material.opacity=0;o.l.material.opacity=.09;o.l.material.color.copy(o.l.userData.c)}
    else if(s===1){o.m.material.opacity=o.m.userData.f*fa;o.l.material.opacity=.95*fa;o.l.material.color.copy(o.l.userData.c)}
    else{o.l.material.color.setHex(0xffffff);o.l.material.opacity=(.7+.3*Math.sin(t/180))*fa;o.m.material.opacity=Math.min(.6,o.m.userData.f*2+.15)*fa}})})}
 ex+=(exT-ex)*Math.min(1,dt*3);
